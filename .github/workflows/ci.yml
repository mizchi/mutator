name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Playwright adapter's tests drive Chromium.
      - run: pnpm --filter @mizchi/mutator-playwright exec playwright install --with-deps chromium
      - run: pnpm exec tsc -p .
      - run: pnpm exec vitest run
      - run: ./scripts/pack-smoke.sh
