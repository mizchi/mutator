name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing (OIDC) and provenance
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the package versions
        run: |
          for p in packages/*/package.json; do
            v=$(node -p "require('./$p').version")
            if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "$p is $v, tag is $GITHUB_REF_NAME"; exit 1; fi
          done
      - run: pnpm exec tsc -p .
      - run: pnpm exec vitest run
      - run: ./scripts/pack-smoke.sh
      # pnpm pack rewrites workspace:* to the published versions; npm publishes the
      # tarballs, authenticating through OIDC (trusted publishing, npm >= 11.5.1),
      # which also attaches provenance.
      - run: npm install -g npm@11
      - name: Publish
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          for p in core vitest jest typecheck cli; do
            (cd "packages/$p" && pnpm pack --pack-destination "$RUNNER_TEMP/pack")
          done
          # Versions already on npm (published by hand, or by an earlier attempt of this
          # run) are skipped, so a re-run or a tag for such a version still gets its release.
          for p in core vitest jest typecheck cli; do
            name=$(node -p "require('./packages/$p/package.json').name")
            version=$(node -p "require('./packages/$p/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version is published, skipping"; continue; fi
            npm publish "$RUNNER_TEMP/pack/$(echo "${name#@}" | tr / -)-$version.tgz" --access public
          done
      - name: GitHub release from the changelog
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v h="## $version" '$0 ~ "^"h { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
