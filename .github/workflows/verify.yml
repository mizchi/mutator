name: verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p .
      # The remaining Windows test portability issues are tracked in #25.
      # Run the native-path regressions explicitly; the packed CLI below exercises
      # every runtime adapter on both operating systems.
      - name: Native Windows path regression tests
        if: runner.os == 'Windows'
        run: pnpm exec vitest run packages/vitest/test/native-paths.test.ts packages/cli/test/native-paths.test.ts packages/playwright/test/native-paths.test.ts
      - run: pnpm --filter @mizchi/mutator-playwright exec playwright install --with-deps chromium
      - name: Full test suite (Linux)
        if: runner.os == 'Linux'
        run: pnpm exec vitest run
      - name: Packed CLI (Vitest, Vite+, Jest, Playwright and skills)
        run: pnpm run pack-smoke
