name: verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p .
      # Catch native path regressions before installing browsers or running the full suite.
      - name: Native Windows path regression tests
        if: runner.os == 'Windows'
        run: pnpm exec vitest run packages/vitest/test/native-paths.test.ts packages/vitest/test/vite-plus.test.ts packages/cli/test/native-paths.test.ts packages/playwright/test/native-paths.test.ts
      # Check unit adapters before spending time installing browser dependencies.
      # The smoke harness installs the matching Chromium before its Playwright run.
      - name: Packed CLI (Vitest, Vite+, Jest, Playwright and skills)
        run: pnpm run pack-smoke --install-browser
      - name: Full test suite
        run: pnpm exec vitest run
