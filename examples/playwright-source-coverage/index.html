<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Source coverage example</title>
    <style>
      :root { color: #183b33; background: #f4f5ee; font-family: system-ui, sans-serif; }
      body { max-width: 38rem; margin: 5rem auto; padding: 0 1.5rem; }
      header p { color: #596e64; }
      nav { display: flex; gap: 1rem; margin: 2rem 0; }
      nav a { color: inherit; padding: .5rem .9rem; border-radius: 1.5rem; text-decoration: none; }
      nav a[aria-current] { background: #dbe8d9; }
      main { background: white; border: 1px solid #dce4d9; border-radius: 1rem; padding: 2rem; }
      h1 { margin-top: 0; }
      label, output { display: block; margin: 1rem 0; }
      input { display: block; margin-top: .5rem; padding: .65rem; font: inherit; max-width: 100%; box-sizing: border-box; }
      button { background: #285d45; color: white; border: 0; border-radius: .4rem; padding: .7rem 1rem; font: inherit; cursor: pointer; }
      output { font-size: 1.6rem; font-weight: 600; }
      footer { margin-top: 2rem; color: #596e64; font-size: .85rem; }
    </style>
  </head>
  <body>
    <header>
      <p>mutator · Playwright example</p>
      <nav aria-label="Pages"><a href="/cart">Cart</a><a href="/profile">Profile</a></nav>
    </header>
    <main id="app"></main>
    <footer>Two small features, tested through the browser.</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
